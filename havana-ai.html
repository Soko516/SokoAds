<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Havana AI</title><style>body{margin:0;background:#0b0b10;color:#f5f5f7;font-family:system-ui}.wrap{max-width:820px;margin:auto;padding:24px}.hero{text-align:center;padding:36px 0}.logo{font-size:42px;font-weight:800}.muted{color:#aaa}.card{background:#17171f;border:1px solid #2b2b36;border-radius:20px;padding:20px;margin:14px 0}.search{display:flex;gap:10px}.search input{flex:1;background:#101016;color:white;border:1px solid #383844;border-radius:12px;padding:14px;font-size:16px}.search button{border:0;border-radius:12px;padding:14px 20px;font-weight:700}.answer{white-space:pre-wrap;line-height:1.65}.gate{position:fixed;inset:0;background:#08080c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:4}.modal{max-width:520px;text-align:center;background:#17171f;border:1px solid #333;border-radius:22px;padding:28px}.modal button{padding:13px 18px;border:0;border-radius:12px;font-weight:700}.danger{color:#ffb4b4}</style></head><body><div id="gate" class="gate"><div class="modal"><div class="logo">Havana AI</div><h2>18+ only</h2><p class="muted">AI search kwa watu wazima kuhusu afya ya ngono, mahusiano na mada za watu wazima zinazoruhusiwa.</p><p class="danger">Haitumiki kwa maudhui ya watoto, unyanyasaji wa kingono au shughuli haramu.</p><button onclick="enter()">Nina miaka 18+ — Endelea</button></div></div><main id="app" class="wrap" style="display:none"><section class="hero"><div class="logo">Havana AI</div><p class="muted">Search + AI • Kiswahili / English</p></section><div class="card"><div class="search"><input id="q" placeholder="Tafuta mada..."><button onclick="searchH()">Search</button></div></div><div id="out" class="card answer">Andika swali ili kuanza.</div></main><script>function enter(){localStorage.havana18='yes';gate.style.display='none';app.style.display='block'}async function searchH(){const q=document.getElementById('q').value.trim();if(!q)return;out.textContent='Inatafuta...';try{const r=await fetch('/api/havana/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,adultConfirmed:true})});const d=await r.json();out.textContent=d.answer||d.error||'Hakuna jibu.'}catch(e){out.textContent='Imeshindikana kuwasiliana na server.'}}if(localStorage.havana18==='yes')enter();</script></body></html>
