services:
  - type: web
    name: sokoads-pesapal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PESAPAL_ENV
        value: LIVE
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_IPN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
