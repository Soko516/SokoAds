name: Build SokoAds Mobile Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon.svg'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'ai.js'
      - 'server.js'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate mobile inputs
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f icon-192.png
          test -f icon-512.png
          test -f icon.svg
          test -f capacitor.config.ts
      - name: Prepare web assets
        run: |
          set -e
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon.svg www/
      - name: Add Android platform
        run: |
          set +e
          npx cap add android
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "cap add android returned $status; checking generated project"
            test -d android
            mkdir -p android/app/src/main/assets
            [ -f android/app/src/main/assets/capacitor.plugins.json ] || printf '[]\n' > android/app/src/main/assets/capacitor.plugins.json
          fi
      - name: Sync Android
        run: |
          mkdir -p android/app/src/main/assets
          [ -f android/app/src/main/assets/capacitor.plugins.json ] || printf '[]\n' > android/app/src/main/assets/capacitor.plugins.json
          npx cap sync android
      - name: Build Android release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: SokoAds-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SokoAds-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare web assets
        run: |
          set -e
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon.svg www/
      - name: Add iOS platform
        run: |
          set +e
          npx cap add ios
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "cap add ios returned $status; recovering generated project"
            test -d ios
          fi
      - name: Sync iOS
        run: |
          set -e
          mkdir -p ios/App/App/public
          npx cap sync ios
      - name: Validate iOS Xcode project
        working-directory: ios/App
        run: |
          set -e
          xcodebuild -list
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: SokoAds-iOS-Xcode-Project
          path: ios
          if-no-files-found: error
